<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Slate Background -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A2A"/>
      <stop offset="50%" stop-color="#11121C"/>
      <stop offset="100%" stop-color="#090A10"/>
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.45)"/>
      <stop offset="50%" stop-color="rgba(139, 92, 246, 0.25)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)"/>
    </linearGradient>

    <!-- Electric Violet Stroke -->
    <linearGradient id="iconViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="25%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <radialGradient id="iconHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </radialGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="iconGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Squircle Container -->
  <rect width="512" height="512" rx="128" fill="#0A0B10"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#iconBg)" stroke="url(#iconBorder)" stroke-width="8"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#iconGlow)"/>

  <!-- Top Glass Highlight Rim -->
  <path d="M120 40 H392" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>

  <!-- Scaled Vector Symbol (origin 100x100 scaled 4.0x centered) -->
  <g transform="translate(56, 56) scale(4.0)">
    <!-- Kitnets Gable Roofline -->
    <path d="M16 46 L50 16 L84 46" fill="none" stroke="url(#iconViolet)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 44 L50 17 L80 44" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Moto Kinetic Wheel Arc -->
    <path d="M26 56 C28 72 38 82 50 82 C62 82 72 72 74 56" fill="none" stroke="url(#iconViolet)" stroke-width="7.5" stroke-linecap="round"/>

    <!-- Motos Dynamic M-Wing / Steering Chevron -->
    <path d="M32 46 L50 62 L68 46" fill="none" stroke="url(#iconViolet)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Vertical Keystone Stem -->
    <path d="M50 18 V50" fill="none" stroke="url(#iconViolet)" stroke-width="6" stroke-linecap="round"/>

    <!-- Keystone & Hub Lights -->
    <circle cx="50" cy="16" r="3.5" fill="#FFFFFF"/>
    <circle cx="50" cy="62" r="4.5" fill="url(#iconHub)"/>
  </g>
</svg>

